name: Engine checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pam
          POSTGRES_PASSWORD: pam
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pam -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://pam:pam@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  knowledge-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: Justice-For-All-Movement/Knowledge-and-verification-engine
          ref: 5e0912888f3a8eaa169e92215ee9bb7d4addcf84
          path: .engines/knowledge
          persist-credentials: false
      - run: npm ci
        working-directory: .engines/knowledge
      - run: npm run test:knowledge
        env:
          E07_DIR: ${{ github.workspace }}/.engines/knowledge
          TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres

      - name: Build and normally install private package for real knowledge export checks
        run: |
          npm run build
          artifact=$(npm pack --pack-destination "$RUNNER_TEMP" --json | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s)[0].filename));')
          mkdir -p "$RUNNER_TEMP/editorial-knowledge-consumer"
          cd "$RUNNER_TEMP/editorial-knowledge-consumer"
          npm init -y
          npm install "$RUNNER_TEMP/$artifact"
      - name: Run actual knowledge export checks through installed public engine
        run: npm run test:knowledge
        env:
          E07_DIR: ${{ github.workspace }}/.engines/knowledge
          TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres
          EDITORIAL_PACKAGE_ROOT: ${{ runner.temp }}/editorial-knowledge-consumer

  consent-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: Justice-For-All-Movement/Consent-rights-and-use-decisions-engine
          ref: be8bf8cdaf333b5278027663eeffaf4a36b6f08a
          path: .engines/consent
          persist-credentials: false
      - run: npm ci
        working-directory: .engines/consent
      - name: Source private export authority regressions
        run: node --test tests/export-authority.test.ts tests/export-dependency-visibility.test.ts tests/export-final-visibility.test.ts tests/export-final-admission.test.ts tests/export-final-facts.test.ts tests/export-final-consent.test.ts tests/export-final-viewpoint.test.ts tests/export-final-project-basis.test.ts tests/export-storage-errors.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres
      - run: npm run test:consent
        env:
          E11_DIR: ${{ github.workspace }}/.engines/consent
          TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres

      - name: Build and normally install private package for actual E11 export chain
        run: |
          npm run build
          artifact=$(npm pack --pack-destination "$RUNNER_TEMP" --json | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s)[0].filename));')
          mkdir -p "$RUNNER_TEMP/editorial-export-consumer"
          cd "$RUNNER_TEMP/editorial-export-consumer"
          npm init -y
          npm install "$RUNNER_TEMP/$artifact"
      - name: Run the same E11 chain through installed public serve export
        run: npm run test:consent
        env:
          E11_DIR: ${{ github.workspace }}/.engines/consent
          TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres
          EDITORIAL_PACKAGE_ROOT: ${{ runner.temp }}/editorial-export-consumer

      - name: Run private export authority regressions through installed public engine
        run: node --test tests/export-authority.test.ts tests/export-dependency-visibility.test.ts tests/export-final-visibility.test.ts tests/export-final-admission.test.ts tests/export-final-facts.test.ts tests/export-final-consent.test.ts tests/export-final-viewpoint.test.ts tests/export-final-project-basis.test.ts tests/export-storage-errors.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres
          EDITORIAL_PACKAGE_ROOT: ${{ runner.temp }}/editorial-export-consumer

  factual-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: Justice-For-All-Movement/Factual-investigation-engine
          ref: 232a339e0e4d6f1e90f06b7aa84b03e6386d0b3a
          path: .engines/factual
          persist-credentials: false
      - run: npm ci
        working-directory: .engines/factual
      - run: npm run test:factual
        env:
          E08_DIR: ${{ github.workspace }}/.engines/factual
          TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres

      - name: Build and normally install private package for real factual export checks
        run: |
          npm run build
          artifact=$(npm pack --pack-destination "$RUNNER_TEMP" --json | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s)[0].filename));')
          mkdir -p "$RUNNER_TEMP/editorial-factual-consumer"
          cd "$RUNNER_TEMP/editorial-factual-consumer"
          npm init -y
          npm install "$RUNNER_TEMP/$artifact"
      - name: Run actual factual export checks through installed public engine
        run: npm run test:factual
        env:
          E08_DIR: ${{ github.workspace }}/.engines/factual
          TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres
          EDITORIAL_PACKAGE_ROOT: ${{ runner.temp }}/editorial-factual-consumer
